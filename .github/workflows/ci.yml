name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          python3 --version

      - name: Run Swift tests
        run: swift test --scratch-path "$RUNNER_TEMP/MKOrbitControl-SwiftPM"

      - name: Run release-tool tests
        run: python3 -m unittest discover -s Tests/ReleaseTests -v

      - name: Validate scripts and Python syntax
        run: |
          bash -n build-dist.sh scripts/privacy-audit.sh scripts/interoperability-audit.sh
          python3 -m compileall -q scripts/release_tools.py Tests/ReleaseTests
          python3 -m json.tool Config/release-dependencies.json >/dev/null

      - name: Enforce native interoperability boundary
        run: bash scripts/interoperability-audit.sh

      - name: Audit public history for private data
        run: bash scripts/privacy-audit.sh
